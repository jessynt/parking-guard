{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "parking-guard.fullname" . }}
  labels:
    {{- include "parking-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  BARK_KEY: {{ .Values.secrets.BARK_KEY | quote }}
  MQTT_USERNAME: {{ .Values.secrets.MQTT_USERNAME | quote }}
  MQTT_PASSWORD: {{ .Values.secrets.MQTT_PASSWORD | quote }}
{{- end }}
